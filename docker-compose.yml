services:
  vulnerable:
    build:
      context: ./vulnerable
    platform: linux/amd64

    env_file:
      - path: ./shared/secrets.env
        required: false

    networks:
      - labnet

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/openssl-1.0.1f/bin/openssl s_client -connect localhost:4433 </dev/null >/dev/null 2>&1"
        ]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

    restart: unless-stopped

  patched:
    build:
      context: ./patched
    platform: linux/amd64

    env_file:
      - path: ./shared/secrets.env
        required: false

    networks:
      - labnet

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/openssl-1.0.1g/bin/openssl s_client -connect localhost:4433 </dev/null >/dev/null 2>&1"
        ]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

    restart: unless-stopped

  webapp:
    build:
      context: ./webapp

    environment:
      DEMO_USER: "student@example.local"
      DEMO_PASSWORD: "heartbleed-lab"

    # Publish container port 8080 on your Mac's port 8090.
    ports:
      - "8090:8080"

    networks:
      - labnet

    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

    restart: unless-stopped

  attacker:
    build:
      context: ./attacker
    platform: linux/amd64

    depends_on:
      vulnerable:
        condition: service_healthy
      patched:
        condition: service_healthy
      webapp:
        condition: service_healthy

    networks:
      - labnet

    stdin_open: true
    tty: true

networks:
  labnet:
    driver: bridge
    #internal: true